version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/EdgePilot
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    directory: /tests/EdgePilot.UxChecks
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
