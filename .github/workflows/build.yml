name: build

on:
  push:
    branches:
      - main
      - feat/v0.1-system-monitor
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/EdgePilot/EdgePilot.csproj

      - name: Build
        run: dotnet build src/EdgePilot/EdgePilot.csproj --configuration Release --no-restore

      - name: Notch UX regression checks
        run: dotnet run --project tests/EdgePilot.UxChecks --configuration Release
