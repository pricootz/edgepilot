name: build

on:
  push:
    branches:
      - main
      - feat/v0.1-system-monitor
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation and private commit attribution
        run: python scripts/check_repository.py
      - name: Scan reachable branch history for secrets
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p /tmp/edgepilot-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/edgepilot-gitleaks gitleaks
          /tmp/edgepilot-gitleaks/gitleaks git . --log-opts="HEAD" --redact --no-banner

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python for asset and package checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux input-region runtime dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0
          ldconfig -p | grep -F 'libxcb-shape.so.0'

      - name: Verify vector brand assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install Pillow==12.3.0 CairoSVG==2.8.2
          python scripts/prepare_brand_assets.py
          git diff --exit-code -- src/EdgePilot/Assets/edgepilot.ico docs/assets/icon-size-check.png

      - name: Build
        run: dotnet build src/EdgePilot/EdgePilot.csproj --configuration Release

      - name: Notch UX regression checks
        run: dotnet run --project tests/EdgePilot.UxChecks --configuration Release

      - name: Input-region regression checks
        run: dotnet run --project tests/EdgePilot.InputChecks --configuration Release

      - name: Localization regression checks
        run: dotnet run --project tests/EdgePilot.LocalizationChecks --configuration Release

      - name: Publish self-contained package
        run: dotnet publish src/EdgePilot/EdgePilot.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o dist/EdgePilot

      - name: Collect third-party notices
        run: python scripts/collect_notices.py

      - name: Prepare and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/Install.ps1 dist/EdgePilot/
          Copy-Item packaging/README.md dist/EdgePilot/
          $exe = (Resolve-Path dist/EdgePilot/EdgePilot.exe).Path
          $smoke = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          Start-Sleep -Milliseconds 1500
          if ($smoke.HasExited) { throw 'Primary instance exited prematurely or native input-region initialization failed.' }
          $second = Start-Process -FilePath $exe -ArgumentList '--settings' -PassThru -WindowStyle Hidden
          if (-not $second.WaitForExit(10000)) {
            $second.Kill()
            throw 'Duplicate instance remained running.'
          }
          if ($second.ExitCode -ne 0) { throw 'Existing instance activation failed.' }
          if (-not $smoke.WaitForExit(20000)) {
            $smoke.Kill()
            throw 'Package smoke check timed out.'
          }
          if ($smoke.ExitCode -ne 0) { throw "Launch/native input-region check failed: $($smoke.ExitCode)" }
          $install = Start-Process -FilePath $exe -ArgumentList '--install' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Per-user installation failed.' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/EdgePilot/EdgePilot.exe'
          if (-not (Test-Path $installed)) { throw 'Installed executable missing.' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'EdgePilot.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing.' }
          Compress-Archive -Path dist/EdgePilot/* -DestinationPath dist/EdgePilot-win-x64.zip
          ((Get-FileHash dist/EdgePilot-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  EdgePilot-win-x64.zip") | Set-Content dist/EdgePilot-win-x64.sha256

      - name: Prepare and verify Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp packaging/install.sh packaging/README.md dist/EdgePilot/
          chmod +x dist/EdgePilot/EdgePilot dist/EdgePilot/install.sh
          timeout 20s xvfb-run -a dist/EdgePilot/EdgePilot --smoke-test &
          smoke_pid=$!
          sleep 2
          # A new Unix session must still resolve to the same per-user EdgePilot instance.
          timeout 6s setsid dist/EdgePilot/EdgePilot --settings
          wait "$smoke_pid"
          dist/EdgePilot/EdgePilot --install
          test -x "$HOME/.local/share/edgepilot/EdgePilot"
          test -f "$HOME/.local/share/applications/io.github.pricootz.EdgePilot.desktop"
          grep -F 'edgepilot.svg' "$HOME/.local/share/applications/io.github.pricootz.EdgePilot.desktop"
          test -f "$HOME/.local/share/edgepilot/Assets/edgepilot.svg"
          tar -czf dist/EdgePilot-linux-x64.tar.gz -C dist/EdgePilot .
          (cd dist && sha256sum EdgePilot-linux-x64.tar.gz > EdgePilot-linux-x64.sha256)

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EdgePilot-win-x64
          path: |
            dist/EdgePilot-win-x64.zip
            dist/EdgePilot-win-x64.sha256
          retention-days: 30

      - name: Upload Ubuntu package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: EdgePilot-linux-x64
          path: |
            dist/EdgePilot-linux-x64.tar.gz
            dist/EdgePilot-linux-x64.sha256
          retention-days: 30
